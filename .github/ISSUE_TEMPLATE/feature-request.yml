name: Idea or feature request
description: Something new or better you'd like to see.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      placeholder: I'd like to … but …
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you've considered
      description: Optional.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I haven't included personal information (names, emails, children's details). Issues are public.
          required: true

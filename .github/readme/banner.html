<!doctype html>
<!--
  Source of banner.png, the README's header (plan 001). Uses the team's art from frontend/art/ and the
  site's fonts and colors (frontend/src/app/globals.css). To regenerate after a change, from frontend/:
    node scripts/render-readme-banner.mjs
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .banner {
    width: 1280px; height: 296px; box-sizing: border-box;
    padding: 0 40px 0 72px;
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px;
    background: #ffffff; border-radius: 24px; overflow: hidden;
  }
  .logo { display: block; height: 108px; width: auto; margin-left: -8px; }
  h1 {
    margin: 20px 0 0; white-space: nowrap; font: 600 42px/1.25 "Shantell Sans", cursive; color: #0f2e8a;
  }
  .marker {
    background-image: linear-gradient(100deg, transparent 0.2em, #f8e683 0.4em,
      #f8e683 calc(100% - 0.4em), transparent calc(100% - 0.2em));
    background-size: 100% 55%; background-position: 0 85%; background-repeat: no-repeat;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
    padding-inline: 0.15em; margin-inline: -0.15em;
  }
  .kid { display: block; width: 520px; height: auto; }
</style>
</head>
<body>
  <div class="banner">
    <div>
      <img class="logo" src="../../frontend/art/Logo.png" alt="HyperStim?">
      <h1>How stimulating are the videos<br><span class="marker">your child watches?</span></h1>
    </div>
    <img class="kid" src="../../frontend/art/kid_1.png" alt="">
  </div>
</body>
</html>

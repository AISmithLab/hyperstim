name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
      - run: npm run build
        env:
          NEXT_PUBLIC_API_MOCK: "1"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the data-commit check reads the pushed commits
      # The server's daily data: commits may change only the dataset files (plan 013).
      - run: |
          if [ "${{ github.event_name }}" = push ]; then range="${{ github.event.before }}..${{ github.sha }}"
          else range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"; fi
          scripts/check-data-commits.sh "$range"
        working-directory: .
      - id: tools
        run: grep '^UV_VERSION=' ../tools.env | sed 's/^UV_VERSION=/uv=/' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ steps.tools.outputs.uv }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: backend/coverage.xml

  # End-to-end tests: the built site against the real backend, in Chromium and WebKit (plan 012).
  e2e:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: tools
        run: grep '^UV_VERSION=' ../tools.env | sed 's/^UV_VERSION=/uv=/' >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ steps.tools.outputs.uv }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
        working-directory: backend
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  # SonarQube Cloud analysis with both coverage reports (plan 012). Skipped for PRs
  # from forks, which get no secrets.
  sonar:
    needs: [frontend, backend]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so Sonar can tell new code from old.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage-frontend
          path: frontend/coverage
      - uses: actions/download-artifact@v8
        with:
          name: coverage-backend
          path: backend
      # Vitest writes paths relative to frontend/; Sonar resolves them from the repo root.
      - run: sed -i 's|^SF:|SF:frontend/|' frontend/coverage/lcov.info
      # The latest release tag is the Sonar version, so "new code" is everything since that
      # release (New Code setting "Previous version").
      - id: release
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
      - uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.projectVersion=${{ steps.release.outputs.tag }}

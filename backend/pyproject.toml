[project]
name = "hyperstim-api"
version = "0.1.0"
description = "Backend API for the HyperStimulation website"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # Analysis pipeline (pipeline/). Pinned exactly like the research pipeline's
    # requirements.txt: feature values only match the dataset's if the decode
    # stack is identical.
    "numpy==2.4.3",
    "opencv-python-headless==4.13.0.92",
    "PyYAML==6.0.1",
    "yt-dlp==2026.8.19",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
# Vendored from the research repo; kept identical to it.
extend-exclude = ["pipeline"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Used by `uv run pytest --cov` (CI); SonarQube Cloud reads coverage.xml (plan 012).
[tool.coverage.run]
source = ["src", "scripts"]
branch = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.xml]
output = "coverage.xml"

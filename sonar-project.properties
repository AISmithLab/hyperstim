# SonarQube Cloud analysis, run by the `sonar` job in .github/workflows/ci.yml (plan 012).
sonar.organization=aismithlab
sonar.projectKey=AISmithLab_hyperstim

sonar.sources=frontend/src,backend/src,backend/scripts
sonar.tests=frontend/src,backend/tests
# frontend/src/test/ holds test helpers. The E2E tests (frontend/e2e/) aren't analysed.
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
# backend/pipeline/ is vendored from the research repo and kept identical to it.
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**,backend/pipeline/**,backend/data/**

# The dev-only fake backend (NEXT_PUBLIC_API_MOCK=1): analysed, but not site code to cover.
sonar.coverage.exclusions=frontend/src/lib/mock.ts

# False positives (plan 012), each for one rule in named files only.
# clipdata: the dev script reads the blog's video list and writes it back
# sorted, which Sonar's path traversal rule takes for a web request's content reaching a file.
sonar.issue.ignore.multicriteria=clipdata,sqliterow
sonar.issue.ignore.multicriteria.clipdata.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.clipdata.resourceKey=backend/scripts/clip_data.py
# sqliterow: Sonar takes sqlite3.Row for a plain tuple, so reading a column by name
# (row["video_id"]) looks like indexing a sequence with a string.
sonar.issue.ignore.multicriteria.sqliterow.ruleKey=python:S6663
sonar.issue.ignore.multicriteria.sqliterow.resourceKey=backend/src/hyperstim_api/collector/*.py

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.version=3.12

# Fail the job when the quality gate fails, so the commit can't be released (plan 010).
sonar.qualitygate.wait=true

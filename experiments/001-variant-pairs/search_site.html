<title>Variant Pair Search</title>
__HEAD__
__STYLE__
<style>
/* Tabs: the overview, then one tab per pair report (grouped by pair type). Same tokens as the reports. */
.tabbar { position: sticky; top: 0; z-index: 5; background: var(--bg); margin: -28px auto 24px; padding-top: 10px;
  max-width: 1320px; border-bottom: 1px solid var(--line-2); }
.tablist { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding: 2px 2px 10px; }
.tablist [role=tab] { flex: none; display: grid; gap: 0; text-align: left; font: 700 0.9rem/1.2 var(--body); color: var(--ink);
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.tablist [role=tab] small { font-weight: 400; font-size: 0.75rem; color: var(--muted); }
.tablist [role=tab][aria-selected=true] { background: var(--ink); color: #fff; border-color: var(--ink); }
.tablist [role=tab][aria-selected=true] small { color: rgb(255 255 255 / 0.8); }
.tablist [role=tab].group { margin-left: 14px; }
.tablist [role=tab]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.frame { display: block; width: 100%; height: calc(100dvh - 96px); min-height: 520px; border: 0; border-radius: 1.5rem;
  background: var(--surface); }
.panel-note { color: var(--ink-2); font-size: 0.9rem; margin-bottom: 10px; }
/* Phones: the report frame goes edge to edge, so the report keeps the full width (it has its own gutters). */
@media (max-width: 640px) { .frame { width: calc(100% + 32px); margin-inline: -16px; border-radius: 0; } }
</style>
__BAR__
__PANELS__
<script>
/* Tabs follow the ARIA tabs pattern (arrow keys, Home, End; automatic activation). A pair's tab
   creates its report frame on first open, so its data, stills and videos load only then.
   The hash names the tab (#overview, #<report name>). */
(() => {
  const tabs = [...document.querySelectorAll('[role=tab]')];
  const byToken = new Map(tabs.map(t => [t.dataset.token, t]));
  function select(tok, focus) {
    const tab = byToken.get(tok) || tabs[0];
    for (const t of tabs) {
      const on = t === tab, panel = document.getElementById(t.getAttribute('aria-controls'));
      t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; panel.hidden = !on;
      if (on && t.dataset.src && !panel.querySelector('iframe')) {
        const f = document.createElement('iframe');
        f.className = 'frame'; f.src = t.dataset.src; f.title = 'Pair report: ' + t.textContent.trim();
        panel.append(f);
      }
    }
    if (focus) tab.focus();
    tab.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    if (location.hash.slice(1) !== tab.dataset.token) {
      try { history.replaceState(null, '', '#' + tab.dataset.token); } catch { location.hash = tab.dataset.token; }
    }
  }
  document.querySelector('[role=tablist]').addEventListener('keydown', e => {
    const k = tabs.indexOf(document.activeElement); if (k < 0) return;
    const to = { ArrowRight: k + 1, ArrowLeft: k - 1, Home: 0, End: tabs.length - 1 }[e.key];
    if (to == null) return;
    e.preventDefault(); select(tabs[(to + tabs.length) % tabs.length].dataset.token, true);
  });
  for (const t of tabs) t.addEventListener('click', () => select(t.dataset.token));
  addEventListener('hashchange', () => select(decodeURIComponent(location.hash.slice(1))));
  document.addEventListener('click', e => {
    const a = e.target.closest('a[data-report]'); if (!a) return;
    e.preventDefault();
    if (byToken.has(a.dataset.report)) { select(a.dataset.report, true); scrollTo(0, 0); }
  });
  /* Overview cards whose report isn't in the site don't link anywhere. */
  for (const a of document.querySelectorAll('a[data-report]')) if (!byToken.has(a.dataset.report)) a.removeAttribute('href');
  select(decodeURIComponent(location.hash.slice(1)) || 'overview');
})();
</script>
